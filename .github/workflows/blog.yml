name: Build and deploy blog

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: blog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache-dependency-path: stats/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Test statistics service
        working-directory: stats
        run: go test ./...

      - name: Build statistics service
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: stats
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p bin
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/nabunana-stats-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o bin/nabunana-stats-linux-arm64 .

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/robots.txt
          test -f dist/rss.xml

      - name: Verify build artifacts
        shell: bash
        run: |
          test -f dist/search-index.json
          test -f dist/404.html
          test -f dist/tags/index.html
          test -f dist/archive/index.html

      - name: Verify content assets
        run: node scripts/check-content-assets.mjs

      - name: Test atomic deployment script
        run: bash scripts/test-deploy-release.sh

      - name: Package site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf site.tar.gz -C dist .

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: blog-${{ github.sha }}
          path: site.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload statistics artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: stats-${{ github.sha }}
          path: stats/bin/nabunana-stats-linux-*
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to server
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: blog-${{ github.sha }}

      - name: Download statistics artifact
        uses: actions/download-artifact@v8
        with:
          name: stats-${{ github.sha }}
          path: stats-artifact

      - name: Configure SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate release
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail

          : "${SERVER_HOST:?Add SERVER_HOST to the production environment secrets}"
          : "${SERVER_USER:?Add SERVER_USER to the production environment secrets}"
          SERVER_PORT="${SERVER_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/var/www/blog}"
          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_STAGE="/tmp/blog-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SSH_TARGET="${SERVER_USER}@${SERVER_HOST}"
          SSH_OPTIONS=(-i ~/.ssh/id_ed25519 -p "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          printf -v prepare_command 'install -m 700 -d %q' "$REMOTE_STAGE"
          ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "$prepare_command"
          scp -i ~/.ssh/id_ed25519 -P "$SERVER_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            site.tar.gz scripts/deploy-release.sh \
            stats-artifact/nabunana-stats-linux-amd64 stats-artifact/nabunana-stats-linux-arm64 \
            "$SSH_TARGET:$REMOTE_STAGE/"

          printf -v deploy_command 'bash %q %q %q %q' \
            "$REMOTE_STAGE/deploy-release.sh" \
            "$REMOTE_STAGE/site.tar.gz" \
            "$DEPLOY_PATH" \
            "$RELEASE_ID"
          ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "$deploy_command"

          printf -v stats_command 'sudo -n /usr/local/sbin/deploy-nabunana-stats %q %q' \
            "$REMOTE_STAGE/nabunana-stats-linux-amd64" \
            "$REMOTE_STAGE/nabunana-stats-linux-arm64"
          ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "$stats_command"

      - name: Verify deployed site
        shell: bash
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -Eeuo pipefail
          SITE_URL="${SITE_URL:-https://elma-gohan.xyz}"
          SITE_URL="${SITE_URL%/}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 \
            --output /dev/null "$SITE_URL/"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output /dev/null "$SITE_URL/api/stats/health"
