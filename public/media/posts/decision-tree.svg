<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" width="1100" height="430" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="100%" height="100%" fill="#fafaf8"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a74b5"/></marker>
<marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#bbb"/></marker></defs>
<text x="30" y="38" font-size="20" font-weight="700" fill="#222">每一步都会分叉，靠检查和记录拉回目标</text>
<circle cx="90" cy="215" r="22" fill="#eef3fb" stroke="#4a74b5" stroke-width="2"/>
<text x="90" y="221" font-size="14" font-weight="700" text-anchor="middle" fill="#1f3b66">任务书</text>
<line x1="112" y1="215" x2="276" y2="215" stroke="#4a74b5" stroke-width="2.4" marker-end="url(#a)"/>
<circle cx="300" cy="215" r="22" fill="#eef3fb" stroke="#4a74b5" stroke-width="2"/>
<text x="300" y="221" font-size="14" font-weight="700" text-anchor="middle" fill="#1f3b66">决策1</text>
<line x1="322" y1="215" x2="486" y2="215" stroke="#4a74b5" stroke-width="2.4" marker-end="url(#a)"/>
<circle cx="510" cy="215" r="22" fill="#eef3fb" stroke="#4a74b5" stroke-width="2"/>
<text x="510" y="221" font-size="14" font-weight="700" text-anchor="middle" fill="#1f3b66">决策2</text>
<line x1="532" y1="215" x2="696" y2="215" stroke="#4a74b5" stroke-width="2.4" marker-end="url(#a)"/>
<circle cx="720" cy="215" r="22" fill="#eef3fb" stroke="#4a74b5" stroke-width="2"/>
<text x="720" y="221" font-size="14" font-weight="700" text-anchor="middle" fill="#1f3b66">决策3</text>
<rect x="880" y="190" width="190" height="50" rx="25" fill="#e7f3e2" stroke="#5b8f3e" stroke-width="2"/>
<text x="975" y="221" font-size="16" font-weight="700" text-anchor="middle" fill="#2f5a1c">最终目标</text>
<line x1="742" y1="215" x2="878" y2="215" stroke="#4a74b5" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M308,193 L395,100" stroke="#bbb" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
<text x="405" y="105" font-size="13" fill="#999">偏离 A</text>
<path d="M518,237 L605,330" stroke="#bbb" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
<text x="615" y="335" font-size="13" fill="#999">偏离 B</text>
<path d="M728,193 L815,110" stroke="#bbb" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
<text x="825" y="115" font-size="13" fill="#999">偏离 C</text>
<path d="M308,237 L395,335" stroke="#bbb" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#g)"/>
<text x="405" y="340" font-size="13" fill="#999">偏离 D</text>
<rect x="187" y="198" width="16" height="34" rx="3" fill="#fff3e0" stroke="#d98a1f" stroke-width="1.5"/>
<text x="195" y="252" font-size="12.5" text-anchor="middle" fill="#8a5a10">CI 检查</text>
<rect x="397" y="198" width="16" height="34" rx="3" fill="#fff3e0" stroke="#d98a1f" stroke-width="1.5"/>
<text x="405" y="252" font-size="12.5" text-anchor="middle" fill="#8a5a10">独立审查</text>
<rect x="607" y="198" width="16" height="34" rx="3" fill="#fff3e0" stroke="#d98a1f" stroke-width="1.5"/>
<text x="615" y="252" font-size="12.5" text-anchor="middle" fill="#8a5a10">CI 检查</text>
<rect x="30" y="378" width="1040" height="36" rx="8" fill="#f7f3ea" stroke="#9a7b3a" stroke-width="1.3"/>
<text x="50" y="402" font-size="14" fill="#5e4a1c">决策记录：每个关键决策都存档。agent 跑偏时，回到最近一个记录点，而不是从头猜。</text>
<line x1="300" y1="237" x2="300" y2="376" stroke="#9a7b3a" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="510" y1="237" x2="510" y2="376" stroke="#9a7b3a" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="720" y1="237" x2="720" y2="376" stroke="#9a7b3a" stroke-width="1" stroke-dasharray="2 4"/>
<text x="30" y="70" font-size="13" fill="#888">灰色虚线是 agent 可能走偏的方向，橙色闸门是检查和审查，蓝线是收束到目标的主路径。示意图。</text>
</svg>