<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" font-family="Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<rect width="100%" height="100%" fill="#fafaf8"/>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#555"/></marker></defs>
<text x="30" y="38" font-size="21" font-weight="700" fill="#222">Harness 架构：人只守两头，中间由程序和证据兜底</text>
<rect x="30" y="60" width="720" height="50" rx="10" fill="#fff3e0" stroke="#d98a1f" stroke-width="1.5"/>
<text x="390" y="82" font-size="15" font-weight="700" fill="#7a4a00" text-anchor="middle">人：澄清需求、拆任务、写验收标准</text>
<text x="390" y="101" font-size="12.5" font-weight="400" fill="#8a5a10" text-anchor="middle">需求含糊时先问，不靠猜；创建 Issue 和入队分别要授权</text>
<rect x="790" y="60" width="420" height="50" rx="10" fill="#fff3e0" stroke="#d98a1f" stroke-width="1.5"/>
<text x="1000" y="82" font-size="15" font-weight="700" fill="#7a4a00" text-anchor="middle">人：看实例、做观感验收</text>
<text x="1000" y="101" font-size="12.5" font-weight="400" fill="#8a5a10" text-anchor="middle">合并和部署另行授权，没有自动合并</text>
<rect x="30" y="135" width="280" height="290" rx="10" fill="#eef3fb" stroke="#4a74b5" stroke-width="1.5"/>
<text x="44" y="163" font-size="15.5" font-weight="700" fill="#1f3b66" text-anchor="start">① 入口与规则</text>
<text x="44" y="201" font-size="14" font-weight="400" fill="#333" text-anchor="start">AGENTS.md：角色和红线</text>
<text x="44" y="239" font-size="14" font-weight="400" fill="#333" text-anchor="start">17 工作流入口：按话选流程</text>
<text x="44" y="277" font-size="14" font-weight="400" fill="#333" text-anchor="start">13 harness：选哪档检查</text>
<text x="44" y="315" font-size="14" font-weight="400" fill="#333" text-anchor="start">新 Agent 不靠聊天记录接手</text>
<text x="44" y="353" font-size="14" font-weight="400" fill="#333" text-anchor="start">不自动入队、重试、合并</text>
<rect x="330" y="135" width="280" height="290" rx="10" fill="#eef3fb" stroke="#4a74b5" stroke-width="1.5"/>
<text x="344" y="163" font-size="15.5" font-weight="700" fill="#1f3b66" text-anchor="start">② 任务合同</text>
<text x="344" y="201" font-size="14" font-weight="400" fill="#333" text-anchor="start">Issue：目标、范围、验收</text>
<text x="344" y="239" font-size="14" font-weight="400" fill="#333" text-anchor="start">plan.json：允许改的路径</text>
<text x="344" y="277" font-size="14" font-weight="400" fill="#333" text-anchor="start">要跑的检查和验收条件</text>
<text x="344" y="315" font-size="14" font-weight="400" fill="#333" text-anchor="start">模型和强度标签先校验</text>
<text x="344" y="353" font-size="14" font-weight="400" fill="#333" text-anchor="start">ready 标签最后才加</text>
<rect x="630" y="135" width="280" height="290" rx="10" fill="#eef3fb" stroke="#4a74b5" stroke-width="1.5"/>
<text x="644" y="163" font-size="15.5" font-weight="700" fill="#1f3b66" text-anchor="start">③ 受控执行（Symphony）</text>
<text x="644" y="201" font-size="14" font-weight="400" fill="#333" text-anchor="start">隔离工作区，只改允许路径</text>
<text x="644" y="239" font-size="14" font-weight="400" fill="#333" text-anchor="start">coder 写一次就结束</text>
<text x="644" y="277" font-size="14" font-weight="400" fill="#333" text-anchor="start">控制器跑 harness 检查</text>
<text x="644" y="315" font-size="14" font-weight="400" fill="#333" text-anchor="start">失败只给一次修复机会</text>
<text x="644" y="353" font-size="14" font-weight="400" fill="#333" text-anchor="start">终态落盘，出 Draft PR</text>
<rect x="930" y="135" width="280" height="290" rx="10" fill="#eef3fb" stroke="#4a74b5" stroke-width="1.5"/>
<text x="944" y="163" font-size="15.5" font-weight="700" fill="#1f3b66" text-anchor="start">④ 独立审查与本机验收</text>
<text x="944" y="201" font-size="14" font-weight="400" fill="#333" text-anchor="start">review.py 固定完整 SHA</text>
<text x="944" y="239" font-size="14" font-weight="400" fill="#333" text-anchor="start">独立 reviewer，作者不能自签</text>
<text x="944" y="277" font-size="14" font-weight="400" fill="#333" text-anchor="start">无阻断问题才起回环实例</text>
<text x="944" y="315" font-size="14" font-weight="400" fill="#333" text-anchor="start">同一 SHA、随机端口、合成数据</text>
<text x="944" y="353" font-size="14" font-weight="400" fill="#333" text-anchor="start">人拿网址验收</text>
<text x="644" y="385" font-size="13" font-weight="700" fill="#c0392b" text-anchor="start">再失败就停，交给人</text>
<line x1="310" y1="280.0" x2="330" y2="280.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="610" y1="280.0" x2="630" y2="280.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="910" y1="280.0" x2="930" y2="280.0" stroke="#555" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="180" y1="110" x2="180" y2="133" stroke="#d98a1f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="470" y1="110" x2="470" y2="133" stroke="#d98a1f" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="1070" y1="133" x2="1070" y2="112" stroke="#d98a1f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="30" y="445" width="1180" height="92" rx="10" fill="#f2f7ee" stroke="#5b8f3e" stroke-width="1.5"/>
<text x="48" y="470" font-size="14.5" font-weight="700" fill="#2f5a1c" text-anchor="start">harness 检查档位（只验证，不调度模型、不修复、不合并）</text>
<text x="48" y="498" font-size="13.5" font-weight="700" fill="#2f5a1c" text-anchor="start">quick</text>
<text x="48" y="520" font-size="12.5" font-weight="400" fill="#33502a" text-anchor="start">契约、文档链接、规则回归</text>
<text x="340" y="498" font-size="13.5" font-weight="700" fill="#2f5a1c" text-anchor="start">frontend</text>
<text x="340" y="520" font-size="12.5" font-weight="400" fill="#33502a" text-anchor="start">quick 加 Vue 生产构建</text>
<text x="630" y="498" font-size="13.5" font-weight="700" fill="#2f5a1c" text-anchor="start">ingestion</text>
<text x="630" y="520" font-size="12.5" font-weight="400" fill="#33502a" text-anchor="start">隔离后端、数据库、浏览器流程</text>
<text x="930" y="498" font-size="13.5" font-weight="700" fill="#2f5a1c" text-anchor="start">Java</text>
<text x="930" y="520" font-size="12.5" font-weight="400" fill="#33502a" text-anchor="start">check_java.py，执行测试数要大于 0</text>
<rect x="30" y="552" width="1180" height="70" rx="10" fill="#f7f3ea" stroke="#9a7b3a" stroke-width="1.5"/>
<text x="48" y="576" font-size="14.5" font-weight="700" fill="#5e4a1c" text-anchor="start">证据层：每次检查留痕，没有证据就不算完成</text>
<text x="48" y="600" font-size="12.5" font-weight="400" fill="#5e4a1c" text-anchor="start">report.json 记录命令、退出码、日志、Git HEAD 和源码指纹；blocked 和 skipped 不算通过；源码变了，旧报告作废</text>
</svg>