<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" role="img" aria-label="Nabunana Digital Space Banner">
  <title>Nabunana Digital Space Hero</title>
  <style><![CDATA[
    .bg { fill: #0b0f19; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4,4; }
    .panel { fill: #111827; stroke: #1e293b; stroke-width: 1.5; }
    .badge { fill: #1e293b; stroke: #334155; stroke-width: 1; }
    .txt-tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #38bdf8; letter-spacing: 0.12em; text-transform: uppercase; }
    .txt-title { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 36px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.02em; }
    .txt-desc { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; line-height: 1.6; fill: #94a3b8; }
    .txt-sub { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; }
    .telemetry-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748b; }
    .telemetry-val { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #34d399; }
    .code-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #cbd5e1; }

    /* Article Card Wireframe */
    .article-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.2; rx: 8; }
    .text-line { fill: #334155; rx: 3; }
    .text-line-accent { fill: #38bdf8; rx: 3; }

    @media (prefers-color-scheme: light) {
      .bg { fill: #f8fafc; }
      .grid { stroke: #e2e8f0; }
      .panel { fill: #ffffff; stroke: #e2e8f0; }
      .badge { fill: #f1f5f9; stroke: #cbd5e1; }
      .txt-tag { fill: #0284c7; }
      .txt-title { fill: #0f172a; }
      .txt-desc { fill: #475569; }
      .txt-sub { fill: #334155; }
      .telemetry-txt { fill: #64748b; }
      .telemetry-val { fill: #059669; }
      .code-txt { fill: #334155; }
      .article-box { fill: #f8fafc; stroke: #0284c7; }
      .text-line { fill: #cbd5e1; }
      .text-line-accent { fill: #0284c7; }
    }
  ]]></style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Grid -->
  <g class="grid">
    <line x1="60" y1="0" x2="60" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="880" y1="0" x2="880" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="290" x2="1200" y2="290" />
  </g>

  <!-- Left: Content -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="280" height="26" rx="13" class="badge" />
    <circle cx="12" cy="13" r="4" fill="#38bdf8" />
    <text x="24" y="17" class="txt-tag">DIGITAL GARDEN // ASTRO &amp; GO</text>

    <text x="0" y="70" class="txt-title">nabunana-digital-space</text>
    <text x="0" y="106" class="txt-desc">运行于 elma-gohan.xyz 的文学空间与个人技术博客。</text>
    <text x="0" y="132" class="txt-desc">Astro 内容集合 · 动态中文字体子集化压缩 · 自研 Go 访问统计微服务。</text>

    <!-- Pillars -->
    <g transform="translate(0, 168)">
      <g transform="translate(0, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#38bdf8" />
        <text x="32" y="25" class="txt-sub">Astro 5 内容集合与类型校验</text>
      </g>
      <g transform="translate(247, 0)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#34d399" />
        <text x="32" y="25" class="txt-sub">中文字体动态按需子集化裁剪</text>
      </g>
      <g transform="translate(0, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#fb7185" />
        <text x="32" y="25" class="txt-sub">Rehype 自定义语法扩展插件</text>
      </g>
      <g transform="translate(247, 48)">
        <rect width="235" height="40" rx="8" class="panel" />
        <circle cx="18" cy="20" r="4" fill="#a78bfa" />
        <text x="32" y="25" class="txt-sub">自研轻量 Go 统计服务 (Systemd)</text>
      </g>
    </g>

    <g transform="translate(0, 286)">
      <text x="0" y="0" class="telemetry-txt">ONLINE AT ELMA-GOHAN.XYZ · NODE &gt;= 22.19 · ZERO TRACKER BLOAT</text>
    </g>
  </g>

  <!-- Right: Article & Typography Wireframe -->
  <g transform="translate(680, 40)">
    <rect width="460" height="280" rx="14" class="panel" />

    <!-- Header -->
    <line x1="0" y1="36" x2="460" y2="36" stroke="#1e293b" class="grid" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="32" y="22" class="telemetry-txt">BLOG_PREVIEW // LITERARY_SPATIAL</text>
    <rect x="375" y="10" width="65" height="18" rx="4" class="badge" />
    <text x="388" y="22" class="telemetry-val">ONLINE</text>

    <!-- Simulated Reader Card -->
    <g transform="translate(24, 52)">
      <rect width="412" height="150" class="article-box" />

      <!-- Typography Simulated Article -->
      <g transform="translate(20, 24)">
        <rect width="180" height="16" class="text-line-accent" />
        <rect y="26" width="370" height="8" class="text-line" />
        <rect y="42" width="340" height="8" class="text-line" />
        <rect y="58" width="360" height="8" class="text-line" />
        
        <!-- Code block snippet -->
        <g transform="translate(0, 76)">
          <rect width="372" height="32" rx="4" class="panel" />
          <text x="12" y="20" class="code-txt">$ git commit -m "docs: literary spatial lighting"</text>
        </g>
      </g>
    </g>

    <!-- Bottom Telemetry -->
    <g transform="translate(24, 218)">
      <rect width="412" height="42" rx="6" class="badge" />
      <text x="14" y="24" class="telemetry-txt">FONT COMPRESSION:</text>
      <text x="150" y="24" class="telemetry-val">LXGW WenKai Subset &lt; 200KB</text>
    </g>
  </g>
</svg>
